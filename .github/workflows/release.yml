name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIRNAME="cti-perl-${VERSION}"
          STAGEDIR="build/${DIRNAME}"
          mkdir -p "${STAGEDIR}/apidoc/CTI/Builder" "${STAGEDIR}/apidoc/CTI/Results"
          # Copy apidoc index
          cp index.html "${STAGEDIR}/apidoc/" 2>/dev/null || true
          # Generate POD HTML docs
          for pm in CTI/DriverManager CTI/Driver CTI/Session \
                    CTI/Builder/FileBuilder CTI/Builder/StreamBuilder CTI/Builder/NullBuilder \
                    CTI/Results/SingleResult CTI/Results/DirectoryResults; do
            pod2html "src/code/${pm}.pm" > "${STAGEDIR}/apidoc/${pm}.html" 2>/dev/null || true
          done
          # Copy source files
          cp -r src/. "${STAGEDIR}/"
          rm -rf "${STAGEDIR}/test/out"
          sed "s/@version@/${VERSION}/g" README.md > "${STAGEDIR}/README.md"
          # Create archives
          cd build
          zip -r "${DIRNAME}.zip" "${DIRNAME}"
          tar czf "${DIRNAME}.tar.gz" "${DIRNAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/cti-perl-*.zip
            build/cti-perl-*.tar.gz
